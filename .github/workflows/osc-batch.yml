# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - worker-tests
# DELIBERATELY EXCLUDED (loud):
#   - none

name: OSC batch mutant probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      mutants:
        description: 'JSON array of mutant refs (branches or SHAs) to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-batch-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  osc_provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry-api
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.mutant }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - name: Worker route tests (plugins, figments, golf, search)
      run: npm test
    - name: Mutant verdict (killed)
      if: failure()
      shell: bash
      run: |
        printf 'MUTANT %s: killed\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" mutant-results.txt
    - name: Mutant verdict (survived)
      if: success()
      shell: bash
      run: |
        printf 'MUTANT %s: survived\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" mutant-results.txt
    - name: Upload mutant results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutant-results-${{ matrix.mutant }}
        path: mutant-results.txt
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
    continue-on-error: true
